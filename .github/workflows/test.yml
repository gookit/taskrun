name: test

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        go-version: ['1.23.x', '1.25.x']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...
      - run: go vet ./...
